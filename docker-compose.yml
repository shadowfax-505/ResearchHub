version: '3.9'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - DB_USER=researchhub_user
      - DB_PASSWORD=researchhub_secure_password
      - DB_CONNECT_STRING=db:1521/FREEPDB1
      - DB_SCHEMA=RESEARCHHUB_USER
      - NODE_ENV=development
      - API_PORT=3000
    depends_on:
      - db
    volumes:
      - ./api:/app/api

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - '3001:3001'
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3000
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules

  db:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: root_password
      APP_USER: researchhub_user
      APP_USER_PASSWORD: researchhub_secure_password
    ports:
      - '1521:1521'
    volumes:
      - db_data:/opt/oracle/oradata
      - ../02_CREATE_TABLES.sql:/container-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds/seed-data.sql:/container-entrypoint-initdb.d/02_seed.sql

volumes:
  db_data:
